[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "robot-quant"
version = "0.1.0"
description = "Isolated offline research contracts for Robot Trade"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "duckdb>=1.2,<2", "polars>=1,<2", "pandas>=2.2,<3", "pyarrow>=19", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
market = ["ccxt>=4,<5", "yfinance>=0.2"]
research = ["vectorbt>=0.28", "plotly>=5,<6", "pandas-ta==0.4.71b0", "quantstats>=0.0.64", "jupyter>=1,<2"]

[dependency-groups]
dev = ["ruff>=0.11", "pytest>=8,<10"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
